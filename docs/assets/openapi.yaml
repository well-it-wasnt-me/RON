openapi: 3.1.0
info:
  title: DeskBot API
  description: REST API for monitoring and controlling DeskBot.
  version: 1.0.0b0
paths:
  /api/v1/health:
    get:
      tags:
      - health
      summary: Health check
      description: 'Return overall health status including component degradation info.


        The response includes the overall status (``"ok"`` or ``"degraded"``)

        and per-component details when a :class:`DegradationRegistry` is

        available on the app state bridge.'
      operationId: health_check_api_v1_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/v1/version:
    get:
      tags:
      - health
      summary: Version info
      description: Return the API version.
      operationId: version_info_api_v1_version_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionResponse'
  /api/v1/state:
    get:
      tags:
      - state
      summary: Current robot state
      description: 'Return the current robot state (IDLE, CURIOUS, LISTENING, etc.).


        Returns a placeholder if the state machine hasn''t been started yet.'
      operationId: get_state_api_v1_state_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StateResponse'
    post:
      tags:
      - commands
      summary: Transition state
      description: Transition the robot to a new state.
      operationId: set_state_api_v1_state_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StateRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/config:
    get:
      tags:
      - state
      summary: Current configuration
      description: 'Return the current configuration as a JSON dict.


        Sensitive fields (API keys) are masked.'
      operationId: get_config_api_v1_config_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigResponse'
  /api/v1/perception:
    get:
      tags:
      - state
      summary: Perception status
      description: Return the current perception status (face detection, scan interval).
      operationId: get_perception_api_v1_perception_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerceptionResponse'
  /api/v1/audio:
    get:
      tags:
      - state
      summary: Audio output status
      description: Return the current audio output status.
      operationId: get_audio_api_v1_audio_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AudioStatusResponse'
  /api/v1/conversation:
    get:
      tags:
      - state
      summary: Conversation status
      description: Return the current conversation service status.
      operationId: get_conversation_api_v1_conversation_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationStatusResponse'
  /api/v1/speak:
    post:
      tags:
      - commands
      summary: Speak text
      description: 'Send text through the conversation pipeline (LLM -> TTS).


        Uses :meth:`ConversationService.handle_user_text` so typed input

        enters the same canonical path as speech recognition.'
      operationId: speak_api_v1_speak_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpeakRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/speak-direct:
    post:
      tags:
      - commands
      summary: Speak text directly via TTS
      description: 'Speak text directly through TTS without going through the LLM pipeline.


        This bypasses STT and LLM entirely - just synthesizes the given text.'
      operationId: speak_direct_api_v1_speak_direct_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpeakRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/emotion:
    post:
      tags:
      - commands
      summary: Set emotion
      description: Set the robot's current emotion.
      operationId: set_emotion_api_v1_emotion_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmotionRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/conversations:
    get:
      tags:
      - conversations
      summary: List conversations
      description: 'List durable conversations, newest first.


        With the default in-memory configuration, the active conversation is

        returned as a single ephemeral entry.'
      operationId: list_conversations_api_v1_conversations_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ConversationSummary'
                type: array
                title: Response List Conversations Api V1 Conversations Get
  /api/v1/conversations/{conversation_id}:
    get:
      tags:
      - conversations
      summary: Get conversation
      description: Get a conversation, including ordered messages.
      operationId: get_conversation_api_v1_conversations__conversation_id__get
      parameters:
      - name: conversation_id
        in: path
        required: true
        schema:
          type: string
          title: Conversation Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationDetail'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - conversations
      summary: Delete conversation
      description: Delete a saved conversation; deleting the active one resets it.
      operationId: delete_conversation_api_v1_conversations__conversation_id__delete
      parameters:
      - name: conversation_id
        in: path
        required: true
        schema:
          type: string
          title: Conversation Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/calibration/servos:
    get:
      tags:
      - calibration
      - calibration
      summary: List all servos
      operationId: list_servos_api_v1_calibration_servos_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServoListResponse'
  /api/v1/calibration/servos/{name}/move:
    post:
      tags:
      - calibration
      - calibration
      summary: Move a servo to an angle
      operationId: move_servo_api_v1_calibration_servos__name__move_post
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
          title: Name
      - name: angle
        in: query
        required: true
        schema:
          type: number
          title: Angle
      - name: duration_s
        in: query
        required: false
        schema:
          type: number
          default: 0.4
          title: Duration S
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServoMoveResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/calibration/servos/{name}/release:
    post:
      tags:
      - calibration
      - calibration
      summary: Release a servo
      operationId: release_servo_api_v1_calibration_servos__name__release_post
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
          title: Name
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServoReleaseResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/calibration/servos/release_all:
    post:
      tags:
      - calibration
      - calibration
      summary: Release all servos
      operationId: release_all_servos_api_v1_calibration_servos_release_all_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReleaseAllResponse'
  /api/v1/calibration/servos/calibrate/{name}:
    post:
      tags:
      - calibration
      - calibration
      summary: Run servo calibration sequence
      description: Centre a servo safely, optionally testing configured endpoints.
      operationId: calibrate_servo_api_v1_calibration_servos_calibrate__name__post
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
          title: Name
      - name: include_limits
        in: query
        required: false
        schema:
          type: boolean
          description: Also visit configured endpoints
          default: false
          title: Include Limits
        description: Also visit configured endpoints
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalibrateServoResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/calibration/display:
    get:
      tags:
      - calibration
      - calibration
      summary: Get display configuration
      operationId: get_display_config_api_v1_calibration_display_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisplayConfigResponse'
  /api/v1/calibration/display/test_pattern:
    post:
      tags:
      - calibration
      - calibration
      summary: Show a test pattern
      operationId: show_test_pattern_api_v1_calibration_display_test_pattern_post
      parameters:
      - name: pattern
        in: query
        required: false
        schema:
          type: string
          default: gradient
          title: Pattern
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestPatternResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/calibration/display/clear:
    post:
      tags:
      - calibration
      - calibration
      summary: Clear the display
      operationId: clear_display_api_v1_calibration_display_clear_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClearDisplayResponse'
  /api/v1/preferences:
    get:
      tags:
      - preferences
      summary: List all preferences
      description: Return all learned user preferences.
      operationId: list_preferences_api_v1_preferences_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreferenceListResponse'
  /api/v1/preferences/{key}:
    get:
      tags:
      - preferences
      summary: Get a specific preference
      description: Return a single preference by key.
      operationId: get_preference_api_v1_preferences__key__get
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
          title: Key
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreferenceItem'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - preferences
      summary: Delete a preference
      description: Delete a preference by key.
      operationId: delete_preference_api_v1_preferences__key__delete
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
          title: Key
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreferenceDeleteResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/learning/status:
    get:
      tags:
      - learning
      - learning
      summary: Learning service status
      description: Return the current learning service status.
      operationId: learning_status_api_v1_learning_status_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearningStatusResponse'
  /api/v1/learning/preferences:
    get:
      tags:
      - learning
      - learning
      summary: Learned preferences
      description: Return all learned preferences.
      operationId: learning_preferences_api_v1_learning_preferences_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearningPreferencesResponse'
  /api/v1/learning/config:
    get:
      tags:
      - learning
      - learning
      summary: Learning configuration
      description: Return the current learning configuration.
      operationId: learning_config_api_v1_learning_config_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearningConfigResponse'
  /api/v1/learning/train:
    post:
      tags:
      - learning
      - learning
      summary: Force a training cycle
      description: Force an immediate training cycle regardless of schedule.
      operationId: force_train_api_v1_learning_train_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForceTrainResponse'
  /api/v1/config/validate:
    post:
      tags:
      - config
      summary: Validate proposed configuration
      description: 'Validate a proposed configuration without applying it.


        Accepts a JSON body with partial or full config overrides. The

        proposed values are merged with the current defaults and validated

        against the :class:`AppSettings` Pydantic model.


        Returns ``{valid: true}`` on success, or ``{valid: false, errors: [...]}``

        with field-level error messages on failure.


        This endpoint **never** modifies the running configuration.'
      operationId: validate_config_api_v1_config_validate_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigValidateRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigValidateResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/config/schema:
    get:
      tags:
      - config
      summary: Configuration JSON Schema
      description: 'Return the full JSON Schema for :class:`AppSettings`.


        This enables the config validator UI to build dynamic form inputs,

        show field descriptions, types, defaults, and validation constraints.'
      operationId: get_config_schema_api_v1_config_schema_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigSchemaResponse'
  /api/v1/performance:
    get:
      tags:
      - performance
      summary: Combined performance summary
      description: Return a combined summary of all profiler data.
      operationId: get_performance_summary_api_v1_performance_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerformanceSummaryResponse'
  /api/v1/performance/frames:
    get:
      tags:
      - performance
      summary: Frame budget stats
      description: Return frame budget performance statistics.
      operationId: get_frame_stats_api_v1_performance_frames_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FrameStatsResponse'
  /api/v1/performance/servos:
    get:
      tags:
      - performance
      summary: Servo latency stats
      description: Return per-servo latency statistics.
      operationId: get_servo_stats_api_v1_performance_servos_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServoProfilerStatsResponse'
  /api/v1/performance/bus:
    get:
      tags:
      - performance
      summary: Event bus throughput
      description: Return event bus throughput and latency statistics.
      operationId: get_bus_stats_api_v1_performance_bus_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusProfilerStatsResponse'
  /api/v1/settings/info:
    get:
      tags:
      - settings
      - settings
      summary: Hardware & subsystem overview
      description: Return a comprehensive overview of all testable subsystems.
      operationId: settings_info_api_v1_settings_info_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsInfoResponse'
  /api/v1/settings/camera/info:
    get:
      tags:
      - settings
      - settings
      summary: Camera info
      description: Return camera type and resolution.
      operationId: camera_info_api_v1_settings_camera_info_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CameraInfoResponse'
  /api/v1/settings/camera/frame:
    get:
      tags:
      - settings
      - settings
      summary: Capture a single frame
      description: Capture a single frame and return it as a JPEG (or BMP fallback).
      operationId: camera_frame_api_v1_settings_camera_frame_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/v1/settings/camera/stream:
    get:
      tags:
      - settings
      - settings
      summary: Live MJPEG camera preview
      description: "Stream a live MJPEG feed from the camera.\n\nThe browser can display this directly in an ``<img>`` tag::\n\n    <img src=\"/api/v1/settings/camera/stream\" />"
      operationId: camera_stream_api_v1_settings_camera_stream_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/v1/settings/mic/info:
    get:
      tags:
      - settings
      - settings
      summary: Microphone info
      description: Return microphone type and sample rate.
      operationId: mic_info_api_v1_settings_mic_info_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MicrophoneInfoResponse'
  /api/v1/settings/mic/level:
    get:
      tags:
      - settings
      - settings
      summary: Current microphone input level
      description: 'Return the current microphone RMS level (0..1).


        For :class:`UsbMicrophone` this reads the continuously-updated

        ``_last_rms_value`` from the background capture thread (zero

        conflict with the conversation audio loop). For other microphones

        a best-effort value is returned.'
      operationId: mic_level_api_v1_settings_mic_level_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MicLevelResponse'
  /api/v1/settings/mic/test:
    post:
      tags:
      - settings
      - settings
      summary: Record and play back a mic test
      description: 'Record *duration* seconds from a temporary microphone and return WAV.


        A **temporary** microphone instance is created with the same settings

        as the active one so the conversation audio loop is not disturbed.

        The recorded audio is returned as a WAV file for the browser to play.'
      operationId: mic_test_api_v1_settings_mic_test_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MicTestRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/settings/audio/info:
    get:
      tags:
      - settings
      - settings
      summary: Audio output info
      description: Return audio output type, sample rate, and channels.
      operationId: audio_info_api_v1_settings_audio_info_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AudioInfoResponse'
  /api/v1/settings/audio/devices:
    get:
      tags:
      - settings
      - settings
      summary: List available audio output devices
      description: 'List available audio output devices via ``sounddevice``.


        Returns an empty list when ``sounddevice`` is not installed or when

        no audio subsystem is available.  The PortAudio query runs in a

        thread with a 3-second timeout so it can never block the API.'
      operationId: audio_devices_api_v1_settings_audio_devices_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AudioDevicesResponse'
  /api/v1/settings/audio/input-devices:
    get:
      tags:
      - settings
      - settings
      summary: List available audio input devices
      description: List available audio input devices via ``sounddevice``.
      operationId: audio_input_devices_api_v1_settings_audio_input_devices_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AudioDevicesResponse'
  /api/v1/settings/audio/tone:
    post:
      tags:
      - settings
      - settings
      summary: Play a test tone
      description: Play a sine-wave test tone through the current audio output.
      operationId: audio_tone_api_v1_settings_audio_tone_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ToneRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToneResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/settings/audio/test-device:
    post:
      tags:
      - settings
      - settings
      summary: Play a test tone through a specific device
      description: 'Play a test tone through a specific output device (temporary).


        This creates a temporary :class:`UsbSpeaker` for the given device,

        plays the tone, and closes it. Useful for testing different outputs

        before committing to a config change.'
      operationId: audio_test_device_api_v1_settings_audio_test_device_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AudioDeviceTestRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AudioTestDeviceResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/settings/audio/switch:
    post:
      tags:
      - settings
      - settings
      summary: Switch the active audio output device
      description: 'Switch the active audio output to a different device at runtime.


        Creates a new :class:`UsbSpeaker` for the requested device and swaps

        it into the bridge, TTS engine, and sound-effects player. The old

        output is closed.'
      operationId: audio_switch_api_v1_settings_audio_switch_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AudioSwitchRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AudioSwitchResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/settings/audio/stop:
    post:
      tags:
      - settings
      - settings
      summary: Stop audio playback
      description: Stop whatever is currently playing on the audio output.
      operationId: audio_stop_api_v1_settings_audio_stop_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToneResponse'
  /api/v1/settings/tts/test:
    post:
      tags:
      - settings
      - settings
      summary: Speak a test phrase
      description: Speak a test phrase through the configured TTS engine.
      operationId: tts_test_api_v1_settings_tts_test_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TTSTestRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TTSTestResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/settings/llm/test:
    post:
      tags:
      - settings
      - settings
      summary: Send a test prompt to the LLM
      description: Send a test prompt to the LLM and return the response text.
      operationId: llm_test_api_v1_settings_llm_test_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LLMTestRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LLMTestResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/settings/sound-effect/{name}:
    post:
      tags:
      - settings
      - settings
      summary: Play a sound effect
      description: Play a named sound effect (e.g. ``talk``, ``thinking``, ``cute``).
      operationId: play_sound_effect_api_v1_settings_sound_effect__name__post
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
          title: Name
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SoundEffectResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/settings/sound-effects:
    get:
      tags:
      - settings
      - settings
      summary: List available sound effects
      description: List all available sound effect names.
      operationId: list_sound_effects_api_v1_settings_sound_effects_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SoundEffectsListResponse'
  /api/v1/system/info:
    get:
      tags:
      - system
      - system
      summary: System information
      description: Return system information for the dashboard.
      operationId: system_info_api_v1_system_info_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemInfoResponse'
  /api/v1/system/logs:
    get:
      tags:
      - system
      - system
      summary: Recent log entries
      description: Return recent log entries from the in-memory ring buffer.
      operationId: system_logs_api_v1_system_logs_get
      parameters:
      - name: level
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by level (DEBUG, INFO, WARNING, ERROR)
          title: Level
        description: Filter by level (DEBUG, INFO, WARNING, ERROR)
      - name: search
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Text search
          title: Search
        description: Text search
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 500
          minimum: 1
          default: 200
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - system
      - system
      summary: Clear log buffer
      description: Clear the in-memory log ring buffer.
      operationId: clear_logs_api_v1_system_logs_delete
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
  /api/v1/system/bluetooth:
    get:
      tags:
      - system
      - system
      summary: Bluetooth status
      description: Return Bluetooth speaker status if available.
      operationId: bluetooth_status_api_v1_system_bluetooth_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BluetoothResponse'
components:
  schemas:
    AudioDevice:
      properties:
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
        index:
          anyOf:
          - type: integer
          - type: 'null'
          title: Index
        channels:
          anyOf:
          - type: integer
          - type: 'null'
          title: Channels
        default:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Default
      additionalProperties: true
      type: object
      title: AudioDevice
      description: A single sounddevice entry.
      examples:
      - channels: 2
        default: true
        index: 2
        name: hw:1,0
    AudioDeviceTestRequest:
      properties:
        device:
          anyOf:
          - type: string
          - type: integer
          title: Device
          default: default
        frequency_hz:
          type: number
          maximum: 20000.0
          minimum: 20.0
          title: Frequency Hz
          default: 440.0
        duration_s:
          type: number
          maximum: 10.0
          minimum: 0.1
          title: Duration S
          default: 1.0
        volume:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Volume
          default: 0.5
      additionalProperties: true
      type: object
      title: AudioDeviceTestRequest
      description: Play a test tone through a specific output device (runtime test).
      examples:
      - device: default
        duration_s: 1.0
        frequency_hz: 440.0
        volume: 0.5
    AudioDevicesResponse:
      properties:
        devices:
          items:
            $ref: '#/components/schemas/AudioDevice'
          type: array
          title: Devices
          default: []
        available:
          type: boolean
          title: Available
          default: true
        error:
          anyOf:
          - type: string
          - type: 'null'
          title: Error
      additionalProperties: true
      type: object
      title: AudioDevicesResponse
      description: List of available audio devices.
      examples:
      - available: true
        devices:
        - channels: 2
          default: true
          index: 2
          name: hw:1,0
      - available: false
        devices: []
        error: sounddevice not installed
    AudioInfoResponse:
      properties:
        type:
          type: string
          title: Type
        sample_rate:
          anyOf:
          - type: integer
          - type: 'null'
          title: Sample Rate
        channels:
          anyOf:
          - type: integer
          - type: 'null'
          title: Channels
        is_mock:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Is Mock
        output_device:
          anyOf:
          - type: string
          - type: 'null'
          title: Output Device
      additionalProperties: true
      type: object
      required:
      - type
      title: AudioInfoResponse
      description: Audio output type, sample rate, and channels.
      examples:
      - channels: 2
        is_mock: false
        output_device: default
        sample_rate: 48000
        type: UsbSpeaker
    AudioStatusResponse:
      properties:
        enabled:
          type: boolean
          title: Enabled
        talking:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Talking
        detail:
          anyOf:
          - type: string
          - type: 'null'
          title: Detail
      additionalProperties: true
      type: object
      required:
      - enabled
      title: AudioStatusResponse
      description: Audio output status.
      examples:
      - enabled: true
        talking: false
      - detail: DeskBot app not attached
        enabled: false
    AudioSwitchRequest:
      properties:
        device:
          anyOf:
          - type: string
          - type: integer
          title: Device
          default: default
      additionalProperties: true
      type: object
      title: AudioSwitchRequest
      description: Switch the active audio output device at runtime.
      examples:
      - device: usb_headset
    AudioSwitchResponse:
      properties:
        status:
          type: string
          title: Status
        device:
          anyOf:
          - type: string
          - type: integer
          - type: 'null'
          title: Device
        type:
          anyOf:
          - type: string
          - type: 'null'
          title: Type
      additionalProperties: true
      type: object
      required:
      - status
      title: AudioSwitchResponse
      description: Acknowledgement of an audio device switch.
      examples:
      - device: usb_headset
        status: ok
        type: UsbSpeaker
    AudioTestDeviceResponse:
      properties:
        status:
          type: string
          title: Status
        device:
          anyOf:
          - type: string
          - type: integer
          - type: 'null'
          title: Device
        frequency_hz:
          anyOf:
          - type: number
          - type: 'null'
          title: Frequency Hz
        duration_s:
          anyOf:
          - type: number
          - type: 'null'
          title: Duration S
      additionalProperties: true
      type: object
      required:
      - status
      title: AudioTestDeviceResponse
      description: Acknowledgement of a device test tone.
      examples:
      - device: default
        duration_s: 1.0
        frequency_hz: 440.0
        status: ok
    BluetoothResponse:
      properties:
        available:
          type: boolean
          title: Available
        type:
          anyOf:
          - type: string
          - type: 'null'
          title: Type
        is_bluetooth:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Is Bluetooth
        connected:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Connected
        sink_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Sink Name
        device_mac:
          anyOf:
          - type: string
          - type: 'null'
          title: Device Mac
        device_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Device Name
        auto_connect:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Auto Connect
        playing:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Playing
        sample_rate:
          anyOf:
          - type: integer
          - type: 'null'
          title: Sample Rate
        channels:
          anyOf:
          - type: integer
          - type: 'null'
          title: Channels
      additionalProperties: true
      type: object
      required:
      - available
      title: BluetoothResponse
      description: Bluetooth speaker status.
      examples:
      - available: true
        connected: true
        device_name: DeskBot BT
        is_bluetooth: true
        type: BluetoothSpeaker
      - available: false
    BusProfilerStatsResponse:
      properties:
        enabled:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Enabled
      additionalProperties: true
      type: object
      title: BusProfilerStatsResponse
      description: Event bus throughput and latency statistics.
      examples:
      - avg_latency_ms: 0.4
        events_per_s: 120.0
        subscribers: 12
        total_events: 5400
      - enabled: false
    CalibrateServoResponse:
      properties:
        servo:
          type: string
          title: Servo
        sequence:
          items:
            $ref: '#/components/schemas/CalibrationStep'
          type: array
          title: Sequence
      additionalProperties: true
      type: object
      required:
      - servo
      - sequence
      title: CalibrateServoResponse
      description: Result of a servo calibration sequence.
      examples:
      - sequence:
        - actual_angle: 0.0
          angle: 0.0
          position: min
        - actual_angle: 90.0
          angle: 90.0
          position: centre
        servo: pan
    CalibrationStep:
      properties:
        position:
          type: string
          title: Position
        angle:
          type: number
          title: Angle
        actual_angle:
          type: number
          title: Actual Angle
      additionalProperties: true
      type: object
      required:
      - position
      - angle
      - actual_angle
      title: CalibrationStep
      description: One step of a calibration sequence.
      examples:
      - actual_angle: 0.0
        angle: 0.0
        position: min
    CameraInfoResponse:
      properties:
        type:
          type: string
          title: Type
        width:
          anyOf:
          - type: integer
          - type: 'null'
          title: Width
        height:
          anyOf:
          - type: integer
          - type: 'null'
          title: Height
        is_mock:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Is Mock
        captured:
          anyOf:
          - type: integer
          - type: 'null'
          title: Captured
      additionalProperties: true
      type: object
      required:
      - type
      title: CameraInfoResponse
      description: Camera type and resolution.
      examples:
      - captured: 1024
        height: 480
        is_mock: false
        type: UsbCamera
        width: 640
    ClearDisplayResponse:
      properties:
        cleared:
          type: boolean
          title: Cleared
      additionalProperties: true
      type: object
      required:
      - cleared
      title: ClearDisplayResponse
      description: Acknowledgement of display clear.
      examples:
      - cleared: true
    CommandResponse:
      properties:
        status:
          type: string
          title: Status
          description: '"ok" or "error".'
        detail:
          anyOf:
          - type: string
          - type: 'null'
          title: Detail
      additionalProperties: true
      type: object
      required:
      - status
      title: CommandResponse
      description: Generic command acknowledgement with the echoed payload.
      examples:
      - status: ok
        text: Hello!
      - emotion: happy
        status: ok
      - state: curious
        status: ok
      - detail: DeskBot app not attached
        status: error
    ConfigResponse:
      properties: {}
      additionalProperties: true
      type: object
      title: ConfigResponse
      description: Current (masked) configuration. Free-form nested object.
      examples:
      - displays:
          backend: gc9a01
          height: 240
          rotation: 0
          width: 240
        env: development
        hardware: mock
        llm:
          api_key: sk-x****
          model: gpt-4o-mini
          provider: openai
    ConfigSchemaResponse:
      properties: {}
      additionalProperties: true
      type: object
      title: ConfigSchemaResponse
      description: The full JSON Schema for the :class:`AppSettings` model (free-form).
      examples:
      - properties:
          env:
            default: development
            type: string
        title: AppSettings
        type: object
    ConfigValidateRequest:
      properties: {}
      additionalProperties: true
      type: object
      title: ConfigValidateRequest
      description: 'A partial or full configuration override to validate.


        Any subset of the :class:`AppSettings` fields may be supplied; omitted

        fields fall back to the current defaults during validation.'
      examples:
      - displays:
          backend: gc9a01
          height: 240
          width: 240
        env: development
      - servos:
          pan:
            max: 180
            min: 0
    ConfigValidateResponse:
      properties:
        valid:
          type: boolean
          title: Valid
        errors:
          items:
            $ref: '#/components/schemas/ConfigValidationErrorItem'
          type: array
          title: Errors
          default: []
      additionalProperties: true
      type: object
      required:
      - valid
      title: ConfigValidateResponse
      description: Result of a config validation request.
      examples:
      - valid: true
      - errors:
        - field: displays.width
          input: -1
          message: Input should be greater than 0
          type: greater_than
        valid: false
    ConfigValidationErrorItem:
      properties:
        field:
          type: string
          title: Field
        message:
          type: string
          title: Message
        type:
          type: string
          title: Type
        input:
          title: Input
      additionalProperties: true
      type: object
      required:
      - field
      - message
      - type
      title: ConfigValidationErrorItem
      description: A single validation error.
      examples:
      - field: displays.width
        input: -1
        message: Input should be greater than 0
        type: greater_than
    ConversationDetail:
      properties:
        id:
          type: string
          title: Id
        system_prompt:
          type: string
          title: System Prompt
        messages:
          items:
            $ref: '#/components/schemas/MessageItem'
          type: array
          title: Messages
      type: object
      required:
      - id
      - system_prompt
      title: ConversationDetail
      description: A conversation and its messages.
      examples:
      - id: abc123
        messages:
        - content: Hello! Who are you?
          role: user
        - content: I'm DeskBot, your desktop companion!
          role: assistant
        system_prompt: You are a helpful desktop robot.
    ConversationStatusResponse:
      properties:
        enabled:
          type: boolean
          title: Enabled
        state:
          anyOf:
          - type: string
          - type: 'null'
          title: State
        wake_checker:
          anyOf:
          - type: string
          - type: 'null'
          title: Wake Checker
        stt:
          anyOf:
          - type: string
          - type: 'null'
          title: Stt
        tts:
          anyOf:
          - type: string
          - type: 'null'
          title: Tts
        llm:
          anyOf:
          - type: string
          - type: 'null'
          title: Llm
      additionalProperties: true
      type: object
      required:
      - enabled
      title: ConversationStatusResponse
      description: Conversation pipeline status.
      examples:
      - enabled: true
        llm: OpenAILLM
        state: idle
        stt: WhisperSTT
        tts: OpenAITTS
        wake_checker: OpenWakeWordChecker
      - enabled: false
    ConversationSummary:
      properties:
        id:
          type: string
          title: Id
        created_at:
          type: string
          title: Created At
        system_prompt:
          type: string
          title: System Prompt
        message_count:
          type: integer
          title: Message Count
      type: object
      required:
      - id
      - created_at
      - system_prompt
      - message_count
      title: ConversationSummary
      description: Metadata for one saved conversation.
      examples:
      - created_at: '2026-08-12T10:00:00Z'
        id: abc123
        message_count: 8
        system_prompt: You are a helpful desktop robot.
    DisplayConfigResponse:
      properties:
        backend:
          type: string
          title: Backend
        width:
          type: integer
          title: Width
        height:
          type: integer
          title: Height
        rotation:
          type: integer
          title: Rotation
        spi_hz:
          type: integer
          title: Spi Hz
        invert:
          type: boolean
          title: Invert
      additionalProperties: true
      type: object
      required:
      - backend
      - width
      - height
      - rotation
      - spi_hz
      - invert
      title: DisplayConfigResponse
      description: Display configuration.
      examples:
      - backend: gc9a01
        height: 240
        invert: false
        rotation: 0
        spi_hz: 40000000
        width: 240
    EmotionRequest:
      properties:
        emotion:
          type: string
          title: Emotion
          description: Emotion name (neutral, happy, curious, etc.).
        intensity:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Intensity
          default: 1.0
      additionalProperties: true
      type: object
      required:
      - emotion
      title: EmotionRequest
      description: Request body for the emotion command.
      examples:
      - emotion: happy
        intensity: 0.8
    ForceTrainResponse:
      properties:
        triggered:
          type: boolean
          title: Triggered
        training_cycles_completed:
          type: integer
          title: Training Cycles Completed
        is_training:
          type: boolean
          title: Is Training
      additionalProperties: true
      type: object
      required:
      - triggered
      - training_cycles_completed
      - is_training
      title: ForceTrainResponse
      description: Result of a forced training cycle.
      examples:
      - is_training: false
        training_cycles_completed: 9
        triggered: true
    FrameStatsResponse:
      properties:
        enabled:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Enabled
        target_fps:
          anyOf:
          - type: integer
          - type: 'null'
          title: Target Fps
        actual_fps:
          anyOf:
          - type: number
          - type: 'null'
          title: Actual Fps
        avg_frame_time_ms:
          anyOf:
          - type: number
          - type: 'null'
          title: Avg Frame Time Ms
        p50_frame_time_ms:
          anyOf:
          - type: number
          - type: 'null'
          title: P50 Frame Time Ms
        p95_frame_time_ms:
          anyOf:
          - type: number
          - type: 'null'
          title: P95 Frame Time Ms
        p99_frame_time_ms:
          anyOf:
          - type: number
          - type: 'null'
          title: P99 Frame Time Ms
        dropped_frames:
          anyOf:
          - type: integer
          - type: 'null'
          title: Dropped Frames
        total_frames:
          anyOf:
          - type: integer
          - type: 'null'
          title: Total Frames
      additionalProperties: true
      type: object
      title: FrameStatsResponse
      description: Frame budget statistics.
      examples:
      - actual_fps: 29.4
        avg_frame_time_ms: 34.0
        dropped_frames: 3
        p50_frame_time_ms: 33.0
        p95_frame_time_ms: 38.0
        p99_frame_time_ms: 42.0
        target_fps: 30
        total_frames: 1200
      - enabled: false
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    HealthResponse:
      properties:
        status:
          type: string
          title: Status
          description: '"ok" or "degraded".'
      additionalProperties: true
      type: object
      required:
      - status
      title: HealthResponse
      description: Overall health, possibly with per-component degradation info.
      examples:
      - status: ok
      - components:
          camera:
            reason: device not found
            status: degraded
          microphone:
            status: ok
        status: degraded
    LLMTestRequest:
      properties:
        prompt:
          type: string
          title: Prompt
          default: Hello! Who are you?
      additionalProperties: true
      type: object
      title: LLMTestRequest
      description: Send a test prompt to the LLM and return the response.
      examples:
      - prompt: Hello! Who are you?
    LLMTestResponse:
      properties:
        status:
          type: string
          title: Status
        prompt:
          anyOf:
          - type: string
          - type: 'null'
          title: Prompt
        response:
          anyOf:
          - type: string
          - type: 'null'
          title: Response
        engine:
          anyOf:
          - type: string
          - type: 'null'
          title: Engine
        error:
          anyOf:
          - type: string
          - type: 'null'
          title: Error
      additionalProperties: true
      type: object
      required:
      - status
      title: LLMTestResponse
      description: Result of an LLM test prompt.
