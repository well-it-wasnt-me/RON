<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DeskBot Config Validator</title>
<link rel="stylesheet" href="/assets/css/app.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-darker.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>
<style>
  body { height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  /* Two-pane layout */
  .main { display: flex; flex: 1; overflow: hidden; }
  .panel { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .panel-left { border-right: 1px solid var(--border); }
  .panel-header { padding: .6rem 1rem; background: var(--bg2); font-size: .72rem; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); border-bottom: 1px solid var(--border); }
  .editor-wrap { flex: 1; overflow: auto; }
  .CodeMirror { height: 100% !important; font-size: 13px; line-height: 1.5; }
  .results { flex: 1; overflow: auto; padding: 1rem; }
  /* Result cards */
  .result-card { background: var(--card); border: 1px solid var(--border); border-radius: .5rem; padding: 1rem; margin-bottom: .75rem; border-left: 4px solid var(--border2); }
  .result-card.valid { border-left-color: var(--accent2); }
  .result-card.invalid { border-left-color: var(--red); }
  .result-card h3 { font-size: .95rem; margin-bottom: .5rem; }
  .result-card.valid h3 { color: var(--accent2); }
  .result-card.invalid h3 { color: var(--red); }
  .error-list { list-style: none; }
  .error-item { padding: .5rem .75rem; background: var(--bg); border: 1px solid var(--border); border-radius: .4rem; margin-bottom: .4rem; font-size: .82rem; }
  .error-field { color: var(--red); font-weight: 600; font-family: ui-monospace, monospace; }
  .error-msg { color: var(--text); margin-top: .15rem; }
  .error-type { color: var(--muted); font-size: .72rem; }
  /* Schema reference */
  .schema-section { margin-bottom: 1.25rem; }
  .schema-section h4 { font-size: .85rem; color: var(--accent); margin-bottom: .5rem; cursor: pointer; }
  .schema-section h4:hover { color: var(--accent2); }
  .schema-fields { display: none; }
  .schema-fields.open { display: block; }
  .schema-field { padding: .4rem .75rem; background: var(--bg); border: 1px solid var(--border); border-radius: .4rem; margin-bottom: .3rem; font-size: .82rem; }
  .schema-field .field-name { color: var(--blue); font-family: ui-monospace, monospace; }
  .schema-field .field-type { color: var(--muted); font-size: .72rem; }
  .schema-field .field-default { color: var(--accent2); font-size: .72rem; }
  .schema-field .field-desc { color: var(--muted); font-size: .78rem; margin-top: .15rem; }
  .schema-field .field-enum { color: var(--orange); font-size: .72rem; }
  /* Tabs */
  .tabs { display: flex; border-bottom: 1px solid var(--border); background: var(--bg2); }
  .tab { padding: .5rem 1rem; cursor: pointer; font-size: .82rem; color: var(--muted); border-bottom: 2px solid transparent; }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tab:hover { color: var(--text); }
  .tab-content { display: none; flex: 1; overflow: auto; padding: 1rem; }
  .tab-content.active { display: flex; flex-direction: column; }
</style>
</head>
<body>
<header class="app-bar">
  <div class="app-brand"><span class="brand-icon">&#128221;</span> DeskBot Config Validator</div>
  <nav class="app-nav" data-active="config"></nav>
  <div class="app-bar-right">
    <button class="secondary" onclick="loadCurrentConfig()">Load Current Config</button>
    <button onclick="validateConfig()">Validate</button>
    <button class="secondary" onclick="exportEnv()">Export .env</button>
    <button class="secondary" onclick="exportYaml()">Export YAML</button>
  </div>
</header>
<div class="main">
  <div class="panel panel-left">
    <div class="panel-header">JSON Editor</div>
    <div class="editor-wrap">
      <textarea id="editor">{}</textarea>
    </div>
  </div>
  <div class="panel">
    <div class="tabs">
      <div class="tab active" data-tab="results" onclick="switchTab('results')">Validation Results</div>
      <div class="tab" data-tab="schema" onclick="switchTab('schema')">Schema Reference</div>
    </div>
    <div class="tab-content active" id="tab-results">
      <div class="results" id="results">
        <div class="loading">Click "Load Current Config" to fetch the running configuration, or paste JSON and click "Validate".</div>
      </div>
    </div>
    <div class="tab-content" id="tab-schema">
      <div class="results" id="schemaView">
        <div class="loading">Loading schema reference...</div>
      </div>
    </div>
  </div>
</div>

<script src="/assets/js/app.js"></script>
<script>
let editor;
let currentSchema = null;

document.addEventListener('DOMContentLoaded', function() {
  editor = CodeMirror.fromTextArea(document.getElementById('editor'), {
    mode: 'application/json',
    theme: 'material-darker',
    lineNumbers: true,
    matchBrackets: true,
    autoCloseBrackets: true,
    indentUnit: 2,
    tabSize: 2,
    lineWrapping: true,
  });
  editor.setValue('{\n  \n}');
  loadSchema();
});

function loadCurrentConfig() {
  apiGet(API_BASE + '/config')
    .then(function(config) {
      editor.setValue(JSON.stringify(config, null, 2));
      toast('Config loaded', true);
    })
    .catch(function(err) {
      toast('Failed to load config: ' + err.message, false);
    });
}

function validateConfig() {
  var resultsEl = document.getElementById('results');
  resultsEl.innerHTML = '<div class="loading">Validating...</div>';

  var data;
  try {
    data = JSON.parse(editor.getValue());
  } catch (e) {
    resultsEl.innerHTML = '<div class="result-card invalid">' +
      '<h3>&#10007; Invalid JSON</h3>' +
      '<div class="error-item"><div class="error-msg">' + esc(e.message) + '</div></div>' +
      '</div>';
    return;
  }

  apiPost(API_BASE + '/config/validate', data, { auth: false })
    .then(function(result) {
      if (result.valid) {
        resultsEl.innerHTML = '<div class="result-card valid">' +
          '<h3>&#10003; Configuration is valid</h3>' +
          '<p class="hint">All fields passed validation. This config can be used with DeskBot.</p>' +
          '</div>';
        toast('Config is valid!', true);
      } else {
        var errors = result.errors || [];
        var errorItems = errors.map(function(e) {
          return '<li class="error-item">' +
            '<div class="error-field">' + esc(e.field) + '</div>' +
            '<div class="error-msg">' + esc(e.message) + '</div>' +
            '<div class="error-type">Type: ' + esc(e.type) + ' | Input: ' + esc(String(e.input != null ? e.input : '')) + '</div>' +
            '</li>';
        }).join('');
        resultsEl.innerHTML = '<div class="result-card invalid">' +
          '<h3>&#10007; Validation failed (' + errors.length + ' error' + (errors.length !== 1 ? 's' : '') + ')</h3>' +
          '<ul class="error-list">' + errorItems + '</ul>' +
          '</div>';
        toast(errors.length + ' validation error(s)', false);
      }
    })
    .catch(function(err) {
      resultsEl.innerHTML = '<div class="result-card invalid">' +
        '<h3>&#10007; Request failed</h3>' +
        '<div class="error-item"><div class="error-msg">' + esc(err.message) + '</div></div>' +
        '</div>';
      toast('Validation request failed', false);
    });
}

function loadSchema() {
  var schemaView = document.getElementById('schemaView');
  apiGet(API_BASE + '/config/schema')
    .then(function(schema) {
      currentSchema = schema;
      renderSchema(schema, schemaView);
    })
    .catch(function(err) {
      schemaView.innerHTML = '<div class="result-card invalid">' +
        '<h3>Failed to load schema</h3>' +
        '<div class="error-msg">' + esc(err.message) + '</div>' +
        '</div>';
    });
}

function renderSchema(schema, container) {
  if (!schema || !schema.properties) {
    container.innerHTML = '<div class="loading">No schema available</div>';
    return;
  }

  var defs = schema['$defs'] || schema['definitions'] || {};
  var html = '';
  var props = schema.properties;

  for (var sectionName in props) {
    if (!props.hasOwnProperty(sectionName)) continue;
    var sectionSchema = props[sectionName];
    var sectionRef = sectionSchema['$ref'] || (sectionSchema.allOf && sectionSchema.allOf[0] ? sectionSchema.allOf[0]['$ref'] : '');
    var sectionDef = resolveRef(sectionRef, defs) || sectionSchema;
    var fields = sectionDef.properties || {};
    var required = sectionDef.required || [];
    var defaultVal = sectionSchema['default'];

    if (Object.keys(fields).length === 0 && !sectionRef) continue;

    html += '<div class="schema-section">' +
      '<h4 onclick="this.nextElementSibling.classList.toggle(\'open\')">&#9654; ' + esc(sectionName) + '</h4>' +
      '<div class="schema-fields">';

    for (var fieldName in fields) {
      if (!fields.hasOwnProperty(fieldName)) continue;
      var fieldSchema = fields[fieldName];
      var envKey = 'DESKBOT_' + sectionName.toUpperCase() + '__' + fieldName.toUpperCase();
      var fieldType = fieldSchema.type || (fieldSchema.enum ? 'enum' : 'object');
      var description = fieldSchema.description || '';
      var fieldDefault = fieldSchema['default'];
      var enumVals = fieldSchema.enum || [];
      var isRequired = required.indexOf(fieldName) >= 0;

      html += '<div class="schema-field">' +
        '<span class="field-name">' + esc(fieldName) + '</span>' +
        (isRequired ? '<span style="color:var(--red);font-size:.72rem;"> required</span>' : '') +
        ' <span class="field-type">' + esc(fieldType) + '</span>' +
        (fieldDefault !== undefined ? ' <span class="field-default">default: ' + esc(JSON.stringify(fieldDefault)) + '</span>' : '') +
        (enumVals.length ? ' <span class="field-enum">enum: ' + esc(enumVals.join(', ')) + '</span>' : '') +
        '<div class="field-desc">' + esc(description) + '</div>' +
        '<div style="color:var(--muted2);font-size:.72rem;font-family:ui-monospace,monospace;">' + esc(envKey) + '</div>' +
        '</div>';
    }

    html += '</div></div>';
  }

  container.innerHTML = html || '<div class="loading">No schema properties found</div>';
}

function resolveRef(ref, defs) {
  if (!ref || ref.indexOf('#/$defs/') !== 0) return null;
  var key = ref.replace('#/$defs/', '');
  return defs[key] || null;
}

function switchTab(tabName) {
  var tabs = document.querySelectorAll('.tab');
  for (var i = 0; i < tabs.length; i++) {
    tabs[i].classList.toggle('active', tabs[i].getAttribute('data-tab') === tabName);
  }
  var contents = document.querySelectorAll('.tab-content');
  for (var j = 0; j < contents.length; j++) {
    contents[j].classList.toggle('active', contents[j].id === 'tab-' + tabName);
  }
}

function exportEnv() {
  var data;
  try {
    data = JSON.parse(editor.getValue());
  } catch (e) {
    toast('Cannot export: invalid JSON', false);
    return;
  }
  var lines = flattenToEnv(data, 'DESKBOT');
  var blob = new Blob([lines.join('\n')], { type: 'text/plain' });
  downloadBlob(blob, 'deskbot.env');
  toast('Exported .env file', true);
}

function exportYaml() {
  var data;
  try {
    data = JSON.parse(editor.getValue());
  } catch (e) {
    toast('Cannot export: invalid JSON', false);
    return;
  }
  var yaml = jsonToYaml(data, 0);
  var blob = new Blob([yaml], { type: 'text/plain' });
  downloadBlob(blob, 'deskbot-config.yaml');
  toast('Exported YAML file', true);
}

function flattenToEnv(obj, prefix) {
  var lines = [];
  for (var key in obj) {
    if (!obj.hasOwnProperty(key)) continue;
    var envKey = prefix + '__' + key.toUpperCase();
    var value = obj[key];
    if (value !== null && typeof value === 'object' && !Array.isArray(value)) {
      lines = lines.concat(flattenToEnv(value, envKey));
    } else {
      lines.push(envKey + '=' + JSON.stringify(value));
    }
  }
  return lines;
}

function jsonToYaml(obj, indent) {
  var lvl = indent || 0;
  var pad = '  '.repeat(lvl);
  var out = '';
  for (var key in obj) {
    if (!obj.hasOwnProperty(key)) continue;
    var value = obj[key];
    if (value !== null && typeof value === 'object' && !Array.isArray(value)) {
      out += pad + key + ':\n' + jsonToYaml(value, lvl + 1);
    } else if (Array.isArray(value)) {
      out += pad + key + ': ' + JSON.stringify(value) + '\n';
    } else if (typeof value === 'string') {
      out += pad + key + ': "' + value.replace(/"/g, '\\"') + '"\n';
    } else {
      out += pad + key + ': ' + value + '\n';
    }
  }
  return out;
}

function downloadBlob(blob, filename) {
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
</script>
</body>
</html>
