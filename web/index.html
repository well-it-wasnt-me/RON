<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DeskBot</title>
<link rel="stylesheet" href="/assets/css/app.css">
<style>
:root{--sidebar-w:220px}
body{display:flex;overflow:hidden}
/* Sidebar */
#sidebar{width:var(--sidebar-w);background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;position:fixed;top:0;left:0;bottom:0;z-index:100;transition:transform .25s ease}
#sidebar .logo{padding:1.2rem 1rem;font-size:1.1rem;font-weight:700;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:.5rem}
#sidebar .logo .icon{font-size:1.3rem}
#sidebar nav{flex:1;padding:.75rem 0;overflow-y:auto}
#sidebar nav a{display:flex;align-items:center;gap:.6rem;padding:.55rem 1rem;color:var(--muted);font-size:.9rem;border-left:3px solid transparent;transition:all .15s}
#sidebar nav a:hover{color:var(--text);background:rgba(255,255,255,.03)}
#sidebar nav a.active{color:var(--accent);border-left-color:var(--accent);background:rgba(108,99,255,.08)}
#sidebar nav a .nav-icon{font-size:1.1rem;width:1.5rem;text-align:center}
#sidebar nav .nav-sep{border-top:1px solid var(--border);margin:.5rem 1rem}
#sidebar .sidebar-footer{padding:.75rem 1rem;border-top:1px solid var(--border);font-size:.75rem;color:var(--muted2)}
/* Main */
#main{flex:1;margin-left:var(--sidebar-w);display:flex;flex-direction:column;height:100vh;overflow:hidden}
#topbar{padding:.75rem 1.5rem;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:var(--bg2);flex-shrink:0}
#topbar .page-title{font-size:1rem;font-weight:600}
#conn-status{display:flex;align-items:center;gap:.4rem;font-size:.8rem;color:var(--muted)}
#conn-status .dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
#conn-status.online .dot{background:var(--green);box-shadow:0 0 6px var(--green)}
#conn-status.offline .dot{background:var(--red)}
#conn-status.reconnecting .dot{background:var(--yellow);animation:pulse 1s infinite}
#content{flex:1;overflow-y:auto;padding:1.5rem;max-width:1200px;width:100%}
/* Mobile toggle */
#menu-toggle{display:none;background:var(--border);border:none;color:var(--text);padding:.4rem .6rem;border-radius:.4rem;font-size:1.2rem;cursor:pointer}
#menu-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:99}
@media(max-width:768px){
#sidebar{transform:translateX(-100%)}
#sidebar.open{transform:translateX(0)}
#main{margin-left:0}
#menu-toggle{display:block}
#menu-overlay.show{display:block}
}
/* Logs */
#log-controls{display:flex;gap:.5rem;margin-bottom:.75rem;flex-wrap:wrap;align-items:center}
#log-controls select,#log-controls input{background:var(--bg);border:1px solid var(--border);border-radius:.4rem;padding:.4rem .6rem;color:var(--text);font-size:.82rem}
#log-controls input{flex:1;min-width:150px}
#log-list{max-height:calc(100vh - 250px);overflow-y:auto;font-family:ui-monospace,'SF Mono',Consolas,monospace;font-size:.78rem;line-height:1.6}
.log-entry{display:grid;grid-template-columns:90px 60px 140px 1fr;gap:.5rem;padding:.15rem .5rem;border-bottom:1px solid rgba(42,45,58,.3);white-space:nowrap}
.log-entry>*{min-width:0;overflow:hidden;text-overflow:ellipsis}
.log-entry .l-time{color:var(--muted2)}
.log-entry .l-level{font-weight:600}
.log-entry .l-level.DEBUG{color:var(--muted)}
.log-entry .l-level.INFO{color:var(--blue)}
.log-entry .l-level.WARNING{color:var(--yellow)}
.log-entry .l-level.ERROR{color:var(--red)}
.log-entry .l-logger{color:var(--muted)}
.log-entry .l-event{color:var(--text)}
.log-entry .l-event .l-data{color:var(--muted)}
.log-entry.raw{white-space:pre-wrap;word-break:break-all}
/* Config viewer */
.config-group{margin-bottom:1.5rem}
.config-group h3{font-size:.85rem;color:var(--accent);margin-bottom:.5rem;padding-bottom:.3rem;border-bottom:1px solid var(--border)}
.config-field{display:flex;justify-content:space-between;align-items:center;padding:.4rem 0;font-size:.85rem}
.config-field .cf-label{color:var(--text)}
.config-field .cf-desc{color:var(--muted);font-size:.75rem;margin-top:.1rem}
.config-field .cf-value{color:var(--accent2);font-family:monospace;font-size:.82rem;text-align:right}
.config-field .cf-value.masked{color:var(--muted2)}
/* Event log (dashboard) */
#event-feed{max-height:200px;overflow-y:auto}
.ev-entry{display:flex;gap:.5rem;padding:.2rem 0;font-size:.78rem;border-bottom:1px solid rgba(42,45,58,.3)}
.ev-entry .ev-time{color:var(--muted2);min-width:65px}
.ev-entry .ev-type{color:var(--accent);font-weight:600;min-width:100px}
.ev-entry .ev-data{color:var(--muted)}
.ev-entry .ev-count{color:var(--yellow);font-weight:600;min-width:34px;text-align:right}
.feed-controls{display:flex;gap:.5rem;align-items:center;margin-bottom:.5rem;flex-wrap:wrap}
.feed-controls .mini-btn{background:var(--bg);border:1px solid var(--border);border-radius:.4rem;padding:.25rem .55rem;color:var(--text);font-size:.78rem;cursor:pointer}
.feed-controls .mini-btn:hover{border-color:var(--accent)}
.feed-controls .mini-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}
.feed-controls label{display:flex;align-items:center;gap:.3rem;font-size:.78rem;color:var(--muted);cursor:pointer}
.feed-count{font-size:.75rem;color:var(--muted2);margin-left:auto}
.log-count-badge{font-size:.72rem;color:var(--accent);background:rgba(108,99,255,.12);border-radius:.3rem;padding:.05rem .4rem;margin-left:.3rem}
.state-display{font-size:1.5rem;font-weight:700;color:var(--accent)}
.state-display .emotion{font-size:1rem;color:var(--muted);font-weight:400}
/* Live View */
#live-cam-wrap{position:relative;background:#000;border-radius:.5rem;overflow:hidden;min-height:220px;display:flex;align-items:center;justify-content:center}
#live-cam-stage{position:relative;display:inline-block;line-height:0}
#live-cam{display:block;max-width:100%;max-height:65vh;width:auto;height:auto}
#live-cam-canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#live-overlay{position:absolute;top:.6rem;left:.6rem;display:flex;gap:.4rem;flex-wrap:wrap;pointer-events:none;max-width:calc(100% - 1.2rem);z-index:2}
#live-overlay .ov-badge{background:rgba(0,0,0,.55);border:1px solid var(--border);border-radius:.4rem;padding:.2rem .5rem;font-size:.72rem;color:#fff}
#live-overlay .ov-state{color:var(--accent);font-weight:700}
#live-overlay .ov-face{color:var(--green);transition:opacity .3s}
#live-cam-wrap .cam-msg{color:var(--muted);font-size:.85rem}
#live-meter{height:10px;background:var(--bg);border:1px solid var(--border);border-radius:9999px;overflow:hidden}
#live-meter-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--green),var(--yellow),var(--red));transition:width .06s linear}
.live-row{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;margin-bottom:.5rem}
.live-row button{padding:.35rem .7rem;font-size:.82rem}
.live-row .hint{margin:0}
</style>
</head>
<body>
<div id="menu-overlay"></div>
<aside id="sidebar">
  <div class="logo"><span class="icon">&#129302;</span> DeskBot</div>
  <nav id="nav">
    <a href="#/"><span class="nav-icon">&#9632;</span> Dashboard</a>
    <a href="#/logs"><span class="nav-icon">&#9776;</span> Logs</a>
    <a href="#/audio"><span class="nav-icon">&#9835;</span> Audio</a>
    <a href="#/bluetooth"><span class="nav-icon">&#128225;</span> Bluetooth</a>
    <a href="#/config"><span class="nav-icon">&#9881;</span> Config Viewer</a>
    <a href="#/system"><span class="nav-icon">&#128187;</span> System</a>
    <div class="nav-sep"></div>
    <a href="#/live"><span class="nav-icon">&#128065;</span> Live View</a>
    <a href="#/controls"><span class="nav-icon">&#127919;</span> Controls</a>
    <a href="/learning"><span class="nav-icon">&#129504;</span> Local Brain</a>
    <a href="/teaching"><span class="nav-icon">&#128218;</span> Teaching</a>
    <a href="/calibration"><span class="nav-icon">&#9881;</span> Calibration</a>
    <a href="/config"><span class="nav-icon">&#128221;</span> Config Validator</a>
    <a href="/settings"><span class="nav-icon">&#128295;</span> Hardware Test</a>
  </nav>
  <div class="sidebar-footer">DeskBot</div>
</aside>
<div id="main">
  <header id="topbar">
    <div style="display:flex;align-items:center;gap:.5rem">
      <button id="menu-toggle">&#9776;</button>
      <span class="page-title" id="page-title">Dashboard</span>
    </div>
    <div id="conn-status" class="online"><span class="dot"></span><span id="conn-text">Connected</span></div>
  </header>
  <div id="content"></div>
</div>

<script src="/assets/js/app.js"></script>
<script>
const API = '/api/v1';
const $content = document.getElementById('content');
const $pageTitle = document.getElementById('page-title');
const $conn = document.getElementById('conn-status');
const $connText = document.getElementById('conn-text');
let ws = null, wsReconnect = null;

const PAGES = {
  '/': { title: 'Dashboard', render: renderDashboard },
  '/logs': { title: 'Logs', render: renderLogs },
  '/audio': { title: 'Audio', render: renderAudio },
  '/bluetooth': { title: 'Bluetooth', render: renderBluetooth },
  '/config': { title: 'Configuration', render: renderConfig },
  '/system': { title: 'System', render: renderSystem },
  '/controls': { title: 'Robot Controls', render: renderControls },
  '/live': { title: 'Live View', render: renderLive },
};

// ---- Routing ----
function route() {
  const hash = location.hash.slice(1) || '/';
  if (typeof cleanupLive === 'function') cleanupLive();
  const page = PAGES[hash];
  if (page) {
    $pageTitle.textContent = page.title;
    $content.innerHTML = '<div class="loading">Loading...</div>';
    page.render();
    document.querySelectorAll('#nav a').forEach(a => {
      a.classList.toggle('active', a.getAttribute('href') === '#' + hash || (hash === '/' && a.getAttribute('href') === '#/'));
    });
  } else {
    $pageTitle.textContent = 'Not Found';
    $content.innerHTML = '<div class="card"><p>Page not found.</p></div>';
  }
}
window.addEventListener('hashchange', route);

// ---- WebSocket ----
// High-frequency events hidden by default in the dashboard feed. Mirrors the
// LoggingConfig.noisy_events default on the server (DESKBOT_LOGGING__NOISY_EVENTS).
const NOISY_EVENTS = ['DisplayUpdated','LookRequested','BlinkRequested','ServoMoved','IdleTimeout','LookAroundAction','FaceDetected'];
// Server-configured hide list, fetched from /system/logs/filters at startup.
// Falls back to NOISY_EVENTS above until (or if) the fetch resolves.
let _serverNoisy = null;
function noisyList() { return (_serverNoisy && _serverNoisy.length) ? _serverNoisy : NOISY_EVENTS; }
async function loadNoisyEvents() {
  const f = await apiGet(API + '/system/logs/filters', {safe:true});
  if (f && Array.isArray(f.noisy_events) && f.noisy_events.length) {
    _serverNoisy = f.noisy_events;
    // Reconnect the WS so the live feed honours the server list (e.g. a
    // newly added FaceDetected) without a page reload.
    if (_hideNoisy) reconnectWS();
  }
}
let _hideNoisy = true;   // dashboard "hide noisy events" toggle (default ON)
let _feedPaused = false; // dashboard feed freeze

// Truncate a JSON-serialised event payload at a clean boundary, with an
// ellipsis — so the feed never cuts mid-word ("confidence&qu...").
function truncateData(obj, max) {
  max = max || 80;
  const s = JSON.stringify(obj);
  if (s.length <= max) return esc(s);
  let cut = s.slice(0, max);
  const boundary = Math.max(cut.lastIndexOf(' '), cut.lastIndexOf(','), cut.lastIndexOf(':'));
  if (boundary > max * 0.5) cut = cut.slice(0, boundary);
  return esc(cut) + '…';
}

function wsUrl() {
  const base = (location.protocol==='https:'?'wss:':'ws:') + '//' + location.host + API + '/ws/events';
  if (_hideNoisy && noisyList().length) {
    return base + '?exclude=' + encodeURIComponent(noisyList().join(','));
  }
  return base;
}
function connectWS() {
  if (ws) { ws.onclose = null; try { ws.close(); } catch(e){} ws = null; }
  if (wsReconnect) { clearTimeout(wsReconnect); wsReconnect = null; }
  ws = new WebSocket(wsUrl());
  ws.onopen = () => { $conn.className = 'online'; $connText.textContent = 'Connected'; if (wsReconnect) { clearTimeout(wsReconnect); wsReconnect = null; } };
  ws.onclose = () => { $conn.className = 'offline'; $connText.textContent = 'Disconnected'; wsReconnect = setTimeout(connectWS, 3000); };
  ws.onerror = () => { ws.close(); };
  ws.onmessage = (ev) => { try { handleEvent(JSON.parse(ev.data)); } catch(e){} };
}
function reconnectWS() {
  // Reconnect with the current _hideNoisy setting (toggles the exclude filter).
  connectWS();
}
let _eventFeed = [];
function handleEvent(msg) {
  const $state = document.getElementById('robot-state');
  const $emotion = document.getElementById('robot-emotion');
  if ($state && msg.type === 'StateChanged') $state.textContent = (msg.data.current||'-').toUpperCase();
  if ($emotion && msg.type === 'EmotionChanged') $emotion.textContent = msg.data.current || '-';
  // Always keep StateChanged/EmotionChanged in the feed even if noisy-listed.
  const isNoisy = noisyList().includes(msg.type);
  if (_feedPaused) { updateFeedCount(); return; }
  const dataKey = JSON.stringify(msg.data);
  const top = _eventFeed[0];
  if (top && top.type === msg.type && top.dataKey === dataKey) {
    top.count += 1;            // dedupe consecutive identical events
  } else {
    _eventFeed.unshift({type: msg.type, data: msg.data, dataKey, time: new Date().toLocaleTimeString(), count: 1, noisy: isNoisy});
    if (_eventFeed.length > 50) _eventFeed.pop();
  }
  renderFeed();
}
function renderFeed() {
  const $feed = document.getElementById('event-feed');
  if (!$feed) return;
  const rows = _eventFeed.slice(0, 20).map(e => {
    const count = e.count > 1 ? `<span class="ev-count">×${e.count}</span>` : '';
    return `<div class="ev-entry"><span class="ev-time">${e.time}</span><span class="ev-type">${e.type}</span><span class="ev-data">${truncateData(e.data)}</span>${count}</div>`;
  }).join('');
  $feed.innerHTML = rows || '<div class="loading">No events yet</div>';
  updateFeedCount();
}
function updateFeedCount() {
  const $c = document.getElementById('feed-count');
  if ($c) $c.textContent = _feedPaused ? 'paused' : `${_eventFeed.length} buffered`;
}
function toggleFeedPaused() {
  _feedPaused = !_feedPaused;
  const $btn = document.getElementById('feed-pause');
  if ($btn) { $btn.textContent = _feedPaused ? 'Resume' : 'Pause'; $btn.classList.toggle('active', _feedPaused); }
  updateFeedCount();
}
function toggleHideNoisy() {
  _hideNoisy = !_hideNoisy;
  const $btn = document.getElementById('feed-noisy');
  if ($btn) { $btn.textContent = _hideNoisy ? 'Noisy: hidden' : 'Noisy: shown'; $btn.classList.toggle('active', _hideNoisy); }
  reconnectWS();
}

// ---- Pages ----
async function renderDashboard() {
  const [sys, settings, state, health] = await Promise.all([
    apiGet(API + '/system/info', {safe:true}), apiGet(API + '/settings/info', {safe:true}),
    apiGet(API + '/state', {safe:true}), apiGet(API + '/health', {safe:true})
  ]);
  let html = '<div class="grid">';
  if (sys) {
    const statusBadge = (health && health.status === 'degraded') ? badge('Degraded','warn') : badge('Online','ok');
    html += card('System', `
      ${infoRow('Status', statusBadge)}
      ${infoRow('Uptime', fmtUptime(sys.uptime_s))}
      ${infoRow('Hostname', esc(sys.hostname))}
      ${infoRow('Version', esc(sys.app_version))}
      ${infoRow('Environment', esc(sys.env))}
    `);
  }
  if (state) {
    html += card('Robot', `
      <div class="state-display" id="robot-state">${esc((state.state||'-').toUpperCase())}</div>
      <div class="state-display emotion" id="robot-emotion">-</div>
    `);
  }
  if (settings && settings.audio) {
    const a = settings.audio;
    html += card('Audio', `
      ${infoRow('TTS Engine', esc(settings.tts || '-'))}
      ${infoRow('Output', esc(a.type) + (a.is_mock ? ' ' + badge('mock','mock') : ''))}
      ${infoRow('Sample Rate', a.sample_rate ? a.sample_rate + ' Hz' : '-')}
      ${infoRow('Channels', a.channels || '-')}
    `);
  }
  if (settings && settings.camera) {
    const c = settings.camera;
    html += card('Camera', `
      ${infoRow('Type', esc(c.type) + (c.is_mock ? ' ' + badge('mock','mock') : ''))}
      ${infoRow('Resolution', c.width ? `${c.width}×${c.height}` : '-')}
    `);
  }
  if (settings && settings.microphone) {
    const m = settings.microphone;
    html += card('Microphone', `
      ${infoRow('Type', esc(m.type) + (m.is_mock ? ' ' + badge('mock','mock') : ''))}
      ${infoRow('Sample Rate', m.sample_rate ? m.sample_rate + ' Hz' : '-')}
    `);
  }
  if (health && health.status === 'degraded') {
    const comps = health.components || {};
    const compHtml = Object.entries(comps).map(([k,v]) => infoRow(k, badge(v.status, v.status==='ok'?'ok':v.status==='degraded'?'warn':'err'))).join('');
    html += card('Component Health', compHtml || '<div class="loading">No details</div>');
  }
  html += '</div>';
  const feedControls = `<div class="feed-controls">
    <button class="mini-btn" id="feed-pause">${_feedPaused ? 'Resume' : 'Pause'}</button>
    <button class="mini-btn${_hideNoisy?' active':''}" id="feed-noisy">${_hideNoisy ? 'Noisy: hidden' : 'Noisy: shown'}</button>
    <span class="feed-count" id="feed-count"></span>
  </div>`;
  html += card('Recent Events', feedControls + '<div id="event-feed">' + (_eventFeed.length ? _eventFeed.slice(0,20).map(e => {
    const count = e.count > 1 ? `<span class="ev-count">×${e.count}</span>` : '';
    return `<div class="ev-entry"><span class="ev-time">${e.time}</span><span class="ev-type">${e.type}</span><span class="ev-data">${truncateData(e.data)}</span>${count}</div>`;
  }).join('') : '<div class="loading">No events yet</div>') + '</div>');
  $content.innerHTML = html;
  const $pause = document.getElementById('feed-pause');
  if ($pause) { $pause.classList.toggle('active', _feedPaused); $pause.addEventListener('click', toggleFeedPaused); }
  const $noisy = document.getElementById('feed-noisy');
  if ($noisy) $noisy.addEventListener('click', toggleHideNoisy);
  updateFeedCount();
}

async function renderLogs() {
  $content.innerHTML = `
    <div class="card">
      <div id="log-controls">
        <select id="log-level"><option value="">All Levels</option><option value="DEBUG">DEBUG</option><option value="INFO">INFO</option><option value="WARNING">WARNING</option><option value="ERROR">ERROR</option></select>
        <select id="log-logger"><option value="">All Loggers</option></select>
        <input type="text" id="log-event" placeholder="Event name...">
        <input type="text" id="log-search" placeholder="Search logs...">
        <button class="mini-btn" id="log-noisy">Noisy: hidden</button>
        <button id="log-refresh">Refresh</button>
        <button id="log-clear">Clear</button>
        <label style="display:flex;align-items:center;gap:.3rem;font-size:.8rem;color:var(--muted)"><input type="checkbox" id="log-raw"> Raw JSON</label>
        <label style="display:flex;align-items:center;gap:.3rem;font-size:.8rem;color:var(--muted)"><input type="checkbox" id="log-live" checked> Live</label>
        <span id="log-count" class="log-count-badge"></span>
      </div>
      <div id="log-list"><div class="loading">Loading logs...</div></div>
    </div>`;
  let _logNoisy = true;
  let _liveTimer = null;
  let _lastEpoch = 0;       // for incremental live tail
  let _liveAccum = [];      // entries accumulated during live mode

  async function loadFilters() {
    const f = await apiGet(API + '/system/logs/filters', {safe:true});
    const $sel = document.getElementById('log-logger');
    if ($sel && f && f.loggers) {
      const cur = $sel.value;
      $sel.innerHTML = '<option value="">All Loggers</option>' + f.loggers.map(l => `<option value="${esc(l)}">${esc(l)}</option>`).join('');
      $sel.value = cur;
    }
  }

  async function loadLogs(opts) {
    opts = opts || {};
    const level = document.getElementById('log-level').value;
    const search = document.getElementById('log-search').value;
    const logger = document.getElementById('log-logger').value;
    const event = document.getElementById('log-event').value;
    const raw = document.getElementById('log-raw').checked;
    const live = document.getElementById('log-live').checked;
    const params = new URLSearchParams();
    if (level) params.set('level', level);
    if (search) params.set('search', search);
    if (logger) params.set('logger', logger);
    if (event) params.set('event', event);
    if (_logNoisy && noisyList().length) params.set('exclude', noisyList().join(','));
    if (live && _lastEpoch && opts.tail) params.set('since', _lastEpoch);
    params.set('limit', '200');
    const data = await apiGet(API + '/system/logs?' + params.toString(), {safe:true});
    const $list = document.getElementById('log-list');
    const $count = document.getElementById('log-count');
    if (!data || !data.entries) { $list.innerHTML = '<div class="loading">No logs available</div>'; return; }
    let entries = data.entries;
    if (live && opts.tail && _liveAccum.length) {
      // Prepend previously accumulated tail entries (newest first).
      entries = _liveAccum.concat(entries);
      _liveAccum = [];
    }
    if (entries.length) _lastEpoch = Math.max(_lastEpoch, entries[0].created_epoch || 0);
    if ($count) $count.textContent = `${data.count} shown`;
    if (entries.length === 0 && !opts.tail) { $list.innerHTML = '<div class="loading">No matching entries</div>'; return; }
    const rows = entries.map(e => {
      if (raw) return `<div class="log-entry raw">${esc(JSON.stringify(e))}</div>`;
      const dataStr = e.data && Object.keys(e.data).length ? ' <span class="l-data">' + esc(JSON.stringify(e.data)) + '</span>' : '';
      // Show just the time (HH:MM:SS) to fit the narrow column; full
      // ISO timestamp is available on hover via the title attribute.
      const t = e.timestamp || '';
      const tShort = (t.length >= 19 && t.includes('T')) ? t.slice(11, 19) : t;
      return `<div class="log-entry"><span class="l-time" title="${esc(t)}">${esc(tShort)}</span><span class="l-level ${e.level}">${e.level}</span><span class="l-logger">${esc(e.logger)}</span><span class="l-event">${esc(e.event)}${dataStr}</span></div>`;
    }).join('');
    $list.innerHTML = rows || '<div class="loading">No matching entries</div>';
  }

  function startLive() {
    stopLive();
    _lastEpoch = 0; _liveAccum = [];
    loadLogs({});

  }
  function stopLive() {
    if (_liveTimer) { clearInterval(_liveTimer); _liveTimer = null; }
  }

  document.getElementById('log-refresh').addEventListener('click', () => { _lastEpoch = 0; _liveAccum = []; loadLogs({}); });
  document.getElementById('log-level').addEventListener('change', () => { _lastEpoch = 0; _liveAccum = []; loadLogs({}); });
  document.getElementById('log-logger').addEventListener('change', () => { _lastEpoch = 0; _liveAccum = []; loadLogs({}); });
  document.getElementById('log-event').addEventListener('input', () => { _lastEpoch = 0; _liveAccum = []; loadLogs({}); });
  document.getElementById('log-search').addEventListener('input', () => { _lastEpoch = 0; _liveAccum = []; loadLogs({}); });
  document.getElementById('log-raw').addEventListener('change', () => loadLogs({}));
  document.getElementById('log-live').addEventListener('change', (e) => { if (e.target.checked) startLive(); else stopLive(); });
  const $noisyBtn = document.getElementById('log-noisy');
  $noisyBtn.classList.toggle('active', _logNoisy);

    _lastEpoch = 0; _liveAccum = [];

  document.getElementById('log-clear').addEventListener('click', async () => {
    await apiDelete(API + '/system/logs');
    _lastEpoch = 0; _liveAccum = [];

    loadLogs({});
  });
  loadFilters();
  startLive();
}

async function renderConfig() {
  const cfg = await apiGet(API + '/config', {safe:true});
  if (!cfg) { $content.innerHTML = card('Configuration', '<div class="loading">No data available</div>'); return; }
  const groups = {};
  for (const [key, value] of Object.entries(cfg)) {
    const groupName = _configGroup(key);
    if (!groups[groupName]) groups[groupName] = [];
    groups[groupName].push({key, value});
  }
  let html = card('Configuration', '<p style="color:var(--muted);font-size:.85rem">Read-only view of the current configuration. Changes require editing the environment or .env file and restarting.</p>');
  for (const [groupName, fields] of Object.entries(groups)) {
    html += `<div class="config-group"><h3>${esc(groupName)}</h3>`;
    for (const f of fields) {
      const val = _formatConfigVal(f.key, f.value);
      html += `<div class="config-field"><div><div class="cf-label">${esc(f.key)}</div></div><div class="cf-value ${val.masked?'masked':''}">${esc(val.display)}</div></div>`;
    }
    html += '</div>';
  }
  $content.innerHTML = html;
}
function _configGroup(key) {
  if (['env','log_level','hardware'].includes(key)) return 'General';
  if (key.startsWith('llm') || key.startsWith('tts') || key.startsWith('stt') || key.startsWith('wakeword')) return 'Speech / AI';
  if (key.startsWith('audio') || key.startsWith('microphone') || key.startsWith('camera') || key.startsWith('sounds')) return 'Audio / Hardware';
  if (key.startsWith('display') || key.startsWith('servos') || key.startsWith('face')) return 'Robot / Display';
  if (key.startsWith('api') || key.startsWith('mqtt') || key.startsWith('home_assistant')) return 'Network / Integration';
  if (key.startsWith('perception') || key.startsWith('memory') || key.startsWith('preferences') || key.startsWith('conversation') || key.startsWith('tools') || key.startsWith('plugins') || key.startsWith('performance') || key.startsWith('learning') || key.startsWith('teaching')) return 'AI / Behavior';
  return 'Other';
}
function _formatConfigVal(key, value) {
  if (value === null) return {display: 'null'};
  if (typeof value === 'dict' || (typeof value === 'object' && !Array.isArray(value))) {
    const str = JSON.stringify(value);
    if (key.includes('api_key') || key.includes('key')) return {display: '****', masked: true};
    return {display: str.length > 100 ? str.slice(0,100)+'...' : str};
  }
  if (typeof value === 'string' && (key.includes('api_key') || key.includes('key')) && value) return {display: value.slice(0,4)+'****', masked: true};
  return {display: String(value)};
}

// ---- Live View (see & hear the world as RON) ----
let liveMicWS = null, liveMicCtx = null, liveMicNextTime = 0, liveMicHeader = null, liveCamPoll = null;
let _liveFaces = [], _liveFaceBurst = null, _liveFaceBurstT = null;
let _liveResize = null;

function cleanupLive() {
  // Stop the microphone stream + Web Audio graph.
  if (liveMicWS) { try { liveMicWS.close(); } catch (e) {} liveMicWS = null; }
  if (liveMicCtx) { try { liveMicCtx.close(); } catch (e) {} liveMicCtx = null; }
  liveMicHeader = null; liveMicNextTime = 0;
  // Stop the camera fallback poller (the MJPEG <img> dies with the DOM).
  if (liveCamPoll) { clearInterval(liveCamPoll); liveCamPoll = null; }
  const $btn = document.getElementById('live-listen');
  if ($btn) { $btn.textContent = 'Start listening'; $btn.classList.remove('active', 'danger'); }
  // Drop face-box state + the resize listener.
  _liveFaces = []; _liveFaceBurst = null; clearTimeout(_liveFaceBurstT);
  if (_liveResize) { window.removeEventListener('resize', _liveResize); _liveResize = null; }
}

async function renderLive() {
  const [camInfo, micInfo, state] = await Promise.all([
    apiGet(API + '/settings/camera/info', {safe:true}),
    apiGet(API + '/settings/mic/info', {safe:true}),
    apiGet(API + '/state', {safe:true}),
  ]);
  const camType = camInfo ? esc(camInfo.type) + (camInfo.is_mock ? ' (mock)' : '') : 'none';
  const camRes = camInfo && camInfo.width ? camInfo.width + '×' + camInfo.height : '';
  const micType = micInfo ? esc(micInfo.type) + (micInfo.is_mock ? ' (mock)' : '') : 'none';
  const micSr = micInfo && micInfo.sample_rate ? micInfo.sample_rate + ' Hz' : '';

  let html = '<div class="grid">';
  // RON's eyes — live camera feed with a state/emotion/face overlay.
  html += card("RON's Eyes &#128065;", `
    <div id="live-cam-wrap">
      <div class="cam-msg" id="live-cam-msg">Connecting to camera…</div>
      <div id="live-cam-stage" style="display:none">
        <img id="live-cam" alt="Live camera feed">
        <canvas id="live-cam-canvas"></canvas>
        <div id="live-overlay">
          <span class="ov-badge ov-state" id="live-state">${esc((state && state.state || '-').toUpperCase())}</span>
          <span class="ov-badge" id="live-emotion">emotion -</span>
          <span class="ov-badge ov-face" id="live-face" style="opacity:.3">no face</span>
        </div>
      </div>
    </div>
    <div class="live-row" style="margin-top:.5rem">
      <button id="live-snap">Snapshot</button>
      <button class="secondary" id="live-cam-restart">Restart stream</button>
      <span class="hint">${camType}${camRes ? ' · ' + camRes : ''}</span>
    </div>
  `);
  // RON's ears — live microphone audio played in the browser.
  html += card("RON's Ears &#127908;", `
    <div class="live-row">
      <button id="live-listen">Start listening</button>
      <span class="hint">${micType}${micSr ? ' · ' + micSr : ''}</span>
    </div>
    <div id="live-meter"><div id="live-meter-fill"></div></div>
    <div class="hint" id="live-listen-hint" style="margin-top:.5rem">Press start to hear what RON's microphone picks up, in real time.</div>
  `);
  html += '</div>';
  $content.innerHTML = html;

  startLiveCam();
  document.getElementById('live-snap').addEventListener('click', snapLiveCam);
  document.getElementById('live-cam-restart').addEventListener('click', startLiveCam);
  document.getElementById('live-listen').addEventListener('click', toggleLiveListen);
  _liveFaces = []; _liveFaceBurst = null; clearTimeout(_liveFaceBurstT);
  _liveResize = () => { resizeLiveCanvas(); drawLiveFaces(); };
  window.addEventListener('resize', _liveResize);
}

function startLiveCam() {
  if (liveCamPoll) { clearInterval(liveCamPoll); liveCamPoll = null; }
  const $img = document.getElementById('live-cam');
  const $stage = document.getElementById('live-cam-stage');
  const $msg = document.getElementById('live-cam-msg');
  if (!$img) return;
  $msg.style.display = 'block';
  $msg.textContent = 'Connecting to camera…';
  if ($stage) $stage.style.display = 'none';
  const reveal = () => {
    $msg.style.display = 'none';
    if ($stage) $stage.style.display = 'inline-block';
    resizeLiveCanvas();
    drawLiveFaces();
  };
  $img.onerror = () => {
    // MJPEG not supported / dropped — fall back to frame polling.
    if (liveCamPoll) return;
    $msg.textContent = 'MJPEG unavailable — polling frames…';
    liveCamPoll = setInterval(async () => {
      try {
        const r = await fetch(API + '/settings/camera/frame', { cache: 'no-store' });
        if (!r.ok) return;
        const blob = await r.blob();
        $img.src = URL.createObjectURL(blob);
      } catch (e) { /* keep retrying */ }
    }, 250);
  };
  $img.onload = reveal;
  // Cache-bust so a reconnect fetches a fresh stream.
  $img.src = API + '/settings/camera/stream?' + Date.now();
}

// Match the overlay canvas backing store to the rendered image so the
// normalized face coords map 1:1 to pixels. x,y are face CENTRE in 0..1,
// size is the face height as a fraction of frame height; derive a square
// box from size (fall back to a default when the detector didn't report one).
function resizeLiveCanvas() {
  const $c = document.getElementById('live-cam-canvas');
  const $img = document.getElementById('live-cam');
  if (!$c || !$img) return;
  const w = $img.clientWidth || $img.naturalWidth || 0;
  const h = $img.clientHeight || $img.naturalHeight || 0;
  if (!w || !h) return;
  $c.width = w;
  $c.height = h;
}

function drawLiveFaces() {
  const $c = document.getElementById('live-cam-canvas');
  if (!$c || !$c.width) return;
  const ctx = $c.getContext('2d');
  if (!ctx) return;
  ctx.clearRect(0, 0, $c.width, $c.height);
  const W = $c.width, H = $c.height;
  for (const f of _liveFaces) {
    const size = f.size > 0 ? f.size : 0.18; // ~18% of frame height if unknown
    const boxH = size * H;
    const boxW = boxH * 0.75; // faces are taller than wide; rough aspect
    const cx = f.x * W, cy = f.y * H;
    const x = cx - boxW / 2, y = cy - boxH / 2;
    ctx.lineWidth = Math.max(2, Math.round(H / 240));
    ctx.strokeStyle = f.known ? '#ff3b30' : '#ffffff';
    ctx.strokeRect(x, y, boxW, boxH);
  }
}

async function snapLiveCam() {
  try {
    const r = await fetch(API + '/settings/camera/frame', { cache: 'no-store' });
    if (!r.ok) { toast('Snapshot failed', false); return; }
    const blob = await r.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'deskbot-frame-' + Date.now() + '.jpg';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    toast('Snapshot saved');
  } catch (e) { toast('Snapshot failed', false); }
}

function toggleLiveListen() {
  if (liveMicWS) stopLiveListen();
  else startLiveListen();
}

function startLiveListen() {
  const $btn = document.getElementById('live-listen');
  const $hint = document.getElementById('live-listen-hint');
  // AudioContext must be created from a user gesture (the click).
  try {
    liveMicCtx = new (window.AudioContext || window.webkitAudioContext)();
  } catch (e) { toast('Web Audio not supported', false); return; }
  liveMicNextTime = 0;
  liveMicHeader = null;
  const wsUrl = (location.protocol === 'https:' ? 'wss:' : 'ws:') + '//' + location.host + API + '/settings/mic/stream';
  liveMicWS = new WebSocket(wsUrl);
  liveMicWS.binaryType = 'arraybuffer';
  liveMicWS.onopen = () => {
    if ($btn) { $btn.textContent = 'Stop listening'; $btn.classList.add('danger'); }
    if ($hint) $hint.textContent = 'Live audio streaming — this is what RON hears.';
  };
  liveMicWS.onmessage = (ev) => {
    if (typeof ev.data === 'string') {
      try {
        const h = JSON.parse(ev.data);
        if (h.error) { toast('Microphone unavailable', false); stopLiveListen(); return; }
        liveMicHeader = h;
      } catch (e) {}
    } else {
      playLivePcm(ev.data);
    }
  };
  liveMicWS.onclose = () => {
    if (liveMicWS === null) return; // already cleaned up
    if ($btn) { $btn.textContent = 'Start listening'; $btn.classList.remove('danger'); }
    if ($hint) $hint.textContent = 'Stream stopped.';
    liveMicWS = null;
  };
  liveMicWS.onerror = () => { toast('Mic stream error', false); stopLiveListen(); };
}

function stopLiveListen() {
  const ws = liveMicWS;
  liveMicWS = null; // guard onclose against re-entry
  if (ws) { try { ws.close(); } catch (e) {} }
  if (liveMicCtx) { try { liveMicCtx.close(); } catch (e) {} liveMicCtx = null; }
  liveMicHeader = null; liveMicNextTime = 0;
  const $btn = document.getElementById('live-listen');
  const $fill = document.getElementById('live-meter-fill');
  if ($btn) { $btn.textContent = 'Start listening'; $btn.classList.remove('danger'); }
  if ($fill) $fill.style.width = '0%';
}

function playLivePcm(buf) {
  if (!liveMicCtx || !liveMicHeader) return;
  const sr = liveMicHeader.sample_rate || 16000;
  const ch = liveMicHeader.channels || 1;
  const view = new DataView(buf);
  const frames = (buf.byteLength / 2) / ch;
  if (!frames) return;
  // s16le -> Float32 deinterleaved, plus an RMS level for the meter.
  const chans = [];
  let sumSq = 0;
  for (let c = 0; c < ch; c++) chans.push(new Float32Array(frames));
  for (let i = 0; i < frames; i++) {
    for (let c = 0; c < ch; c++) {
      const s = view.getInt16((i * ch + c) * 2, true) / 32768;
      chans[c][i] = s;
      sumSq += s * s;
    }
  }
  const rms = Math.sqrt(sumSq / (frames * ch));
  const $fill = document.getElementById('live-meter-fill');
  if ($fill) $fill.style.width = Math.min(100, rms * 100 * 2.5) + '%';
  // Schedule gapless playback: buffer (resampled to ctx rate by the source).
  const ab = liveMicCtx.createBuffer(ch, frames, sr);
  for (let c = 0; c < ch; c++) ab.getChannelData(c).set(chans[c]);
  const src = liveMicCtx.createBufferSource();
  src.buffer = ab;
  src.connect(liveMicCtx.destination);
  const now = liveMicCtx.currentTime;
  if (liveMicNextTime < now) liveMicNextTime = now;
  src.start(liveMicNextTime);
  liveMicNextTime += frames / sr;
}
