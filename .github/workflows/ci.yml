name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate (${{ matrix.check }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        check:
          - lint
          - typecheck
          - test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Lint (ruff)
        if: matrix.check == 'lint'
        run: uv run ruff check src tests

      - name: Type check (mypy --strict)
        if: matrix.check == 'typecheck'
        run: uv run mypy src tests

      - name: Install OpenCV headless (for perception tests)
        if: matrix.check == 'test'
        run: uv pip install opencv-python-headless || true

      - name: Run tests
        if: matrix.check == 'test'
        run: uv run pytest -m "not audio" --tb=short -q

  semver:
    name: Release (semantic-release)
    runs-on: ubuntu-latest
    needs: [validate]

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: write

    env:
      RELEASE_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    outputs:
      released: ${{ steps.release.outputs.released }}
      tag: ${{ steps.release.outputs.tag }}
      commit_sha: ${{ steps.release.outputs.commit_sha }}

    steps:
      - name: Checkout (full history for tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ env.RELEASE_TOKEN }}

      - name: Semantic Release
        id: release
        uses: python-semantic-release/python-semantic-release@v10.5.3
        with:
          github_token: ${{ env.RELEASE_TOKEN }}
          git_committer_name: "github-actions[bot]"
          git_committer_email: "41898282+github-actions[bot]@users.noreply.github.com"
